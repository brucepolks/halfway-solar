{% extends "base.html" %}
{% block title %}New Analysis — Halfway Charge{% endblock %}
{% block content %}
<div style="max-width:580px;">
  <a href="/" style="font-size:13px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;">← Back</a>
  <div class="page-eyebrow">Step 1 of 2</div>
  <h1 class="page-title" style="margin-bottom:6px;">New Analysis</h1>
  <p class="page-sub" style="margin-bottom:28px;">Select a client and upload their Eskom bill — we'll do the rest.</p>

  <!-- Progress dots -->
  <div style="display:flex;gap:8px;margin-bottom:28px;">
    <div style="height:4px;flex:1;border-radius:99px;background:var(--red);"></div>
    <div style="height:4px;flex:1;border-radius:99px;background:var(--line2);"></div>
  </div>

  <div class="card">
    <form method="POST" enctype="multipart/form-data">
      <div class="form-group">
        <label>Client *</label>
        <select name="client_id" required>
          <option value="">— Select a client —</option>
          {% for c in clients %}
          <option value="{{ c.id }}" {% if request.args.get('client_id')|int == c.id %}selected{% endif %}>
            {{ c.name }} · {{ c.site_name }}
          </option>
          {% endfor %}
        </select>
        <div style="margin-top:7px;font-size:12px;color:var(--muted);">
          Not listed? <a href="/client/new" style="color:var(--red);">Add client →</a>
        </div>
      </div>

      <div class="form-group">
        <label>Eskom Electricity Bill (PDF) *</label>
        <div id="dropzone" style="
          border: 2px dashed var(--line2); border-radius: 14px;
          padding: 36px 24px; text-align: center; cursor: pointer;
          transition: .2s; background: var(--surface);
        ">
          <div style="font-size:32px;margin-bottom:10px;opacity:.6;">📄</div>
          <div style="font-size:14px;font-weight:600;color:var(--text);">Drop PDF here</div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px;">or <span style="color:var(--red);font-weight:600;">click to browse</span></div>
          <div id="fname" style="margin-top:10px;font-size:12px;color:var(--amber);font-weight:600;"></div>
          <input type="file" name="bill_pdf" id="fileinput" accept=".pdf" required style="display:none;">
        </div>
      </div>

      <button type="submit" class="btn btn-red" style="width:100%;justify-content:center;font-size:15px;padding:14px;">
        Parse Bill &amp; Continue →
      </button>
    </form>
  </div>
</div>
<script>
const z=document.getElementById('dropzone'),inp=document.getElementById('fileinput'),fn=document.getElementById('fname');
z.onclick=()=>inp.click();
z.ondragover=e=>{e.preventDefault();z.style.borderColor='var(--red)';z.style.background='rgba(192,0,0,.08)';};
z.ondragleave=()=>{z.style.borderColor='var(--line2)';z.style.background='var(--surface)';};
z.ondrop=e=>{e.preventDefault();z.style.borderColor='var(--line2)';z.style.background='var(--surface)';
  const f=e.dataTransfer.files[0];if(f){const dt=new DataTransfer();dt.items.add(f);inp.files=dt.files;fn.textContent='✓ '+f.name;}};
inp.onchange=()=>{if(inp.files[0])fn.textContent='✓ '+inp.files[0].name;};
</script>
{% endblock %}
