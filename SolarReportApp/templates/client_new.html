{% extends "base.html" %}
{% block title %}{{ 'Edit' if client else 'New Client' }} — Halfway Charge{% endblock %}
{% block content %}
<div style="max-width:520px;">
  <a href="/" style="font-size:13px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;">← Back</a>
  <div class="page-eyebrow">{{ 'Edit' if client else 'New' }}</div>
  <h1 class="page-title" style="margin-bottom:28px;">{{ 'Edit Client' if client else 'Add Client' }}</h1>
  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label>Client / Property Name *</label>
        <input name="name" value="{{ client.name if client else '' }}" placeholder="e.g. Kiara Lodge" required>
      </div>
      <div class="form-group">
        <label>Site Name on Dash IOT *
          <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:11px;margin-left:6px;">Must match exactly as shown in the Dash IOT dropdown</span>
        </label>
        <input name="site_name" value="{{ client.site_name if client else '' }}" placeholder="e.g. Kiara Bottom" required>
      </div>
      <div class="form-group">
        <label>Address <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;">(optional)</span></label>
        <input name="address" value="{{ client.address if client else '' }}" placeholder="e.g. 447 Vale Avenue, Centurion">
      </div>
      <div class="form-group">
        <label>Client Contact Email <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;">(for sending reports)</span></label>
        <input name="contact_email" type="email" value="{{ client.contact_email if client else '' }}" placeholder="client@email.com">
      </div>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button type="submit" class="btn btn-red">{{ 'Save Changes' if client else 'Add Client' }}</button>
        <a href="/" class="btn btn-grey">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
