<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Halfway Charge Analytics{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,600;12..96,700&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0A0907; --surface: rgba(255,255,255,0.04); --line: rgba(255,255,255,0.08);
    --red: #C00000; --amber: #E8A020; --green: #22C55E;
    --font-d: 'Bricolage Grotesque', sans-serif; --font-b: 'Hanken Grotesk', sans-serif;
  }
  body { background: var(--bg); color: #E8E4DF; font-family: var(--font-b); min-height: 100vh; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(192,0,0,0.15) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  /* NAV */
  nav {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; height: 64px;
    background: rgba(10,9,7,0.85); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--line);
  }
  .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .nav-brand svg { width: 28px; height: 28px; }
  .nav-brand span { font-family: var(--font-d); font-size: 1.05rem; font-weight: 600; color: #fff; letter-spacing: 0.03em; }
  .nav-links { display: flex; gap: 8px; }
  .nav-links a {
    color: rgba(232,228,223,0.6); text-decoration: none; font-size: 0.875rem;
    padding: 6px 14px; border-radius: 8px; transition: all 0.15s;
  }
  .nav-links a:hover { background: var(--surface); color: #fff; }
  .nav-links a.active { background: var(--surface); color: #fff; }

  /* CONTENT */
  .page { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 48px 24px; }

  /* COMPONENTS */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: 10px; font-size: 0.875rem; font-weight: 500;
    cursor: pointer; text-decoration: none; border: none; font-family: var(--font-b);
    transition: all 0.15s;
  }
  .btn-primary { background: var(--red); color: #fff; }
  .btn-primary:hover { background: #a50000; }
  .btn-ghost { background: var(--surface); color: #E8E4DF; border: 1px solid var(--line); }
  .btn-ghost:hover { background: rgba(255,255,255,0.08); }
  .btn-danger { background: rgba(192,0,0,0.15); color: #ff6b6b; border: 1px solid rgba(192,0,0,0.3); }
  .btn-danger:hover { background: rgba(192,0,0,0.25); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; backdrop-filter: blur(8px); }
  .page-title { font-family: var(--font-d); font-size: 2rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
  .page-sub { color: rgba(232,228,223,0.4); margin-bottom: 32px; }

  /* FORM */
  .form-group { margin-bottom: 20px; }
  label { display: block; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(232,228,223,0.4); margin-bottom: 8px; }
  input[type=text], input[type=email], input[type=password], input[type=date], input[type=number], select, textarea {
    width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.06);
    border: 1px solid var(--line); border-radius: 10px; color: #E8E4DF;
    font-family: var(--font-b); font-size: 0.9rem; outline: none; transition: border 0.15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--red); }

  /* TABLE */
  .tbl-wrap { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  thead th { background: rgba(192,0,0,0.15); color: rgba(232,228,223,0.5); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.72rem; padding: 12px 16px; text-align: left; }
  tbody td { padding: 12px 16px; border-top: 1px solid var(--line); }
  tbody tr:hover td { background: rgba(255,255,255,0.03); }

  /* FLASH */
  .flash { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); border-radius: 10px; padding: 12px 16px; margin-bottom: 24px; color: var(--green); }
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav>
  <a class="nav-brand" href="/">
    <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="16,1 6,15 14,15 12,27 22,13 14,13" fill="#C00000"/>
    </svg>
    <span>Halfway Charge</span>
  </a>
  <div class="nav-links">
    <a href="/">Clients</a>
    <a href="/settings">Settings</a>
  </div>
</nav>
<div class="page">
{% block content %}{% endblock %}
</div>
</body>
</html>
