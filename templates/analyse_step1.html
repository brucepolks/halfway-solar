{% extends "base.html" %}
{% block title %}New Report — {{ client.name }}{% endblock %}
{% block content %}
<a href="/client/{{ client.id }}" class="btn btn-ghost" style="margin-bottom:32px;">← Back</a>
<h1 class="page-title">New Report</h1>
<p class="page-sub">{{ client.name }} — Upload Eskom bills</p>
<div class="card" style="max-width:560px;">
  <form method="POST" enctype="multipart/form-data">
    <div class="form-group">
      <label>Eskom Bill PDFs (select one or multiple)</label>
      <input type="file" name="bill_pdf" accept=".pdf" multiple style="padding:10px;">
      <p style="color:rgba(232,228,223,0.35);font-size:0.78rem;margin-top:8px;">Hold Cmd (Mac) or Ctrl (Windows) to select multiple bills for the same site.</p>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Next →</button>
  </form>
</div>
{% endblock %}
